<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- 배경 -->
  <rect width="64" height="64" fill="#f5f2ed" rx="8"/>
  
  <!-- 하트 -->
  <path
    d="M32 50
       C 27 47, 20 42, 20 35
       C 20 30, 23 27, 27 27
       C 29 27, 31 28, 32 30
       C 33 28, 35 27, 37 27
       C 41 27, 44 30, 44 35
       C 44 42, 37 47, 32 50 Z"
    fill="#e8b4b8"
    opacity="0.6"
  />
  
  <!-- D 글자 -->
  <text
    x="20"
    y="37"
    font-family="Georgia, serif"
    font-size="16"
    font-weight="600"
    fill="#8b7355"
    text-anchor="middle"
  >D</text>
  
  <!-- & 기호 -->
  <text
    x="32"
    y="37"
    font-family="Georgia, serif"
    font-size="12"
    font-weight="400"
    fill="#a89080"
    text-anchor="middle"
  >&amp;</text>
  
  <!-- Y 글자 -->
  <text
    x="44"
    y="37"
    font-family="Georgia, serif"
    font-size="16"
    font-weight="600"
    fill="#8b7355"
    text-anchor="middle"
  >Y</text>
  
  <!-- 장식용 작은 벚꽃잎들 -->
  <!-- 왼쪽 위 -->
  <ellipse cx="14" cy="14" rx="2" ry="4" fill="#e8b4b8" opacity="0.5" transform="rotate(-30 14 14)"/>
  <!-- 오른쪽 위 -->
  <ellipse cx="50" cy="14" rx="2" ry="4" fill="#e8b4b8" opacity="0.5" transform="rotate(30 50 14)"/>
  <!-- 왼쪽 아래 -->
  <ellipse cx="14" cy="50" rx="1.8" ry="3.5" fill="#e8b4b8" opacity="0.4" transform="rotate(45 14 50)"/>
  <!-- 오른쪽 아래 -->
  <ellipse cx="50" cy="50" rx="1.8" ry="3.5" fill="#e8b4b8" opacity="0.4" transform="rotate(-45 50 50)"/>
</svg>

